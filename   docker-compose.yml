version: "3.9"

services:
  # =========================
  # Base de données PostgreSQL
  # =========================
  db-settings:
    image: postgres:16
    container_name: db-settings

    environment:
      POSTGRES_DB: settings_db
      POSTGRES_USER: settings_user

    ports:
      - "5439:5432"   # optionnel

    volumes:
      - settings-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - woridge-external-network


  # =========================
  # Micro-service Settings
  # =========================
  ms-settings:
    container_name: woridge-ms-settings

    build:
      context: .
      dockerfile: infra/Dockerfile

    image: ms-settings:latest

    ports:
      - "8088:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # 🔗 Connexion DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-settings:5432/settings_db
      SPRING_DATASOURCE_USERNAME: settings_user
      SPRING_DATASOURCE_PASSWORD: settings_pass

    depends_on:
      - db-settings

    restart: unless-stopped

    networks:
      - woridge-external-network


# =========================
# Volumes
# =========================
volumes:
  settings-db-data:


# =========================
# Networks
# =========================
networks:
  woridge-external-network:
    external: true

version: "3.9"

services:
  # =========================
  # Base de données PostgreSQL
  # =========================
  woridge.db.settings:
    image: postgres:16
    container_name: db-settings
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - settings-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - woridge-external-network
      - provisioning-service-network


  # =========================
  # Micro-service Settings
  # =========================
  ms-settings:
    container_name: woridge-ms-settings
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file:
      - .env
    image: ms-settings:latest
    ports:
      - "${HOST_PORT}:8080"
    environment:
      #SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - woridge.db.settings

    restart: unless-stopped

    networks:
      - woridge-external-network
      - shared-infra-net


# =========================
# Volumes
# =========================
volumes:
  settings-db-data:


# =========================
# Networks
# =========================
networks:
  woridge-external-network:
    external: true

  provisioning-service-network:
    external: true
  shared-infra-net:
    external: true
    name: shared-infra-net

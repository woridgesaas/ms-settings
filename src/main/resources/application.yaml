spring:
  application:
    name: settings-management
  flyway:
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
server:
  port: 8088
  servlet:
    context-path: /api/settings

internal:
  secret-key: ${INTERNAL_SECRET_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  service-identifier: ${MINIO_SERVICE_IDENTIFIER}
  presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY}

work-schedule:
  min-daily-hours: 1
  max-daily-hours: 12

document-template:
  max-size-mb: 10
  allowed-content-type: application/pdf
  allowed-extension: .pdf

recruitment-site:
  logo:
    max-size-mb: 2
    allowed-content-types: image/png,image/jpeg,image/webp,image/svg+xml
    allowed-extensions: .png,.jpg,.jpeg,.webp,.svg

rabbitmq:
  exchange:
    notification: woridge.exchange
  routing:
    tenant-ready: tenant.ready.ms-settings
  queue:
    provisioning: q.settings.provisioning

tenant:
  database:
    host: woridge.db.settings
    port: ${POSTGRES_PORT}
    username: ${POSTGRES_USER}
    password: ${DB_PASSWORD}
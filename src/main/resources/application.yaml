spring:
  application:
    name: settings-management
  flyway:
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE}

server:
  port: 8088
  servlet:
    context-path: /api/settings

internal:
  secret-key: ${INTERNAL_SECRET_KEY}

work-schedule:
  min-daily-hours: 1
  max-daily-hours: 12